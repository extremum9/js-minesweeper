<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Minesweeper</title>
  </head>
  <body>
    <div class="frame">
      <div class="levels js-levels">
        <button class="level-button" type="button" data-level="BEGINNER">Beginner</button>
        <button class="level-button" type="button" data-level="INTERMEDIATE">Intermediate</button>
        <button class="level-button" type="button" data-level="EXPERT">Expert</button>
      </div>
      <div class="panel">
        <span class="counter js-mine-counter"></span>
        <button class="reset-button js-reset-button" type="button" aria-label="Reset"></button>
        <span class="counter js-timer"></span>
      </div>
      <div class="board js-board"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
